name: Build, Publish, and Migrate

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: riddlemes4m/mock-interviews

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=prod-
            type=raw,value=latest
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./sp2023-mis421-mockinterviews/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ---- EF Core Bundle Generation ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: dotnet restore ./sp2023-mis421-mockinterviews/sp2023-mis421-mockinterviews.csproj

      - name: Install dotnet-ef
        run: dotnet tool install -g dotnet-ef

      - name: Build Users Bundle
        run: |
          dotnet ef migrations bundle \
            --project ./sp2023-mis421-mockinterviews/sp2023-mis421-mockinterviews.csproj \
            --context UsersDbContext \
            --self-contained \
            -r linux-x64 \
            --output usersbundle

      - name: Build MockInterviews Bundle
        run: |
          dotnet ef migrations bundle \
            --project ./sp2023-mis421-mockinterviews/sp2023-mis421-mockinterviews.csproj \
            --context MockInterviewsDbContext \
            --self-contained \
            -r linux-x64 \
            --output mockreviewsbundle

      - name: Upload Migration Bundles
        uses: actions/upload-artifact@v3
        with:
          name: migration-bundles
          path: |
            usersbundle
            mockreviewsbundle
          retention-days: 1

  migrate-databases:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Download Migration Bundles
        uses: actions/download-artifact@v3
        with:
          name: migration-bundles

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run Users Migration
        run: |
          chmod +x usersbundle
          ./usersbundle --connection "${{ secrets.CONNECTION_STRING_USERS }}"

      - name: Run MockInterviews Migration
        run: |
          chmod +x mockreviewsbundle
          ./mockreviewsbundle --connection "${{ secrets.CONNECTION_STRING_MOCK }}"
