name: Create Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          year="$(date --utc +%Y)"
          latest_number="$(git tag --list "v${year}.*" | sed -nE "s/^v${year}\\.([0-9]+)$/\\1/p" | sort -n | tail -n 1)"

          if [[ -z "$latest_number" ]]; then
            number=1
          else
            number=$((latest_number + 1))
          fi

          echo "tag=v${year}.${number}" >> "$GITHUB_OUTPUT"

      - name: Tag main
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
