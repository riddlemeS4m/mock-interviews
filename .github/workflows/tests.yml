name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore mock-interviews.sln

      - name: Build
        run: dotnet build mock-interviews.sln --configuration Release --no-restore

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore mock-interviews.sln

      - name: Verify formatting
        run: dotnet format mock-interviews.sln --verify-no-changes --no-restore

  specs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mock_interviews_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mock_interviews_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IntegrationTests__ConnectionString: Host=localhost;Port=5432;Database=mock_interviews_test_db;Username=postgres;Password=postgres;SSL Mode=Disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore mock-interviews.sln

      - name: Build Tailwind CSS
        run: ./scripts/tailwind.sh build

      - name: Build
        run: dotnet build mock-interviews.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test mock-interviews.sln --configuration Release --no-build
