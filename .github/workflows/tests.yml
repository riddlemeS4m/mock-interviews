name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sp2023-mis421-mockinterviews
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: sp2023-mis421-mockinterviews/global.json

      - name: Restore
        run: dotnet restore ../sp2023-mis421-mockinterviews.sln

      - name: Build
        run: dotnet build ../sp2023-mis421-mockinterviews.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ../sp2023-mis421-mockinterviews.sln --configuration Release --no-build
